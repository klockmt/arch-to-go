[package]
name = "arch-to-go-cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "arch-to-go"
path = "src/main.rs"

[dependencies]
arch-to-go-core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
rpassword = "7.5.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3.27.0"

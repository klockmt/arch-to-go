# pacman.conf do sistema instalado: só repositórios oficiais do Arch.
# Não usa o do host, que tem repositórios do CachyOS.
[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
